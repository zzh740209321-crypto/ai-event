# Example LiteLLM proxy config for this project.
# Start a local gateway with: litellm --config configs/litellm_config.yaml --port 4000
# Then set LITELLM_BASE_URL=http://127.0.0.1:4000/v1 and LITELLM_API_KEY in .env.
# Company deployments only need to keep the same model_name aliases
# (gemini-flash-lite, perplexity-sonar) or change the LITELLM_MODEL_* env vars.

model_list:
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: google/gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: perplexity-sonar
    litellm_params:
      model: perplexity/sonar
      api_key: os.environ/PERPLEXITY_API_KEY

  - model_name: perplexity/sonar
    litellm_params:
      model: perplexity/sonar
      api_key: os.environ/PERPLEXITY_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
